apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teemii.fullname" . }}-frontend
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: teemii-frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: teemii-frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          env:
            - name: VITE_APP_TITLE
              value: Teemii
            - name: VITE_APP_PORT
              value: "80"
          ports:
            - containerPort: 80
