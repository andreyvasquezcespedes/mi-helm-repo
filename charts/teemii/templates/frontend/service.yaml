apiVersion: v1
kind: Service
metadata:
  name: {{ include "teemii.fullname" . }}-frontend
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: teemii-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
