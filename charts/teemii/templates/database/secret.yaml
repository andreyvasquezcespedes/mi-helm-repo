apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teemii.fullname" . }}-db-secret
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ randAlphaNum 16 | quote }}
