apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teemii.fullname" . }}-backend-config
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
data:
  EXPRESS_PORT: "3000"
  SOCKET_IO_PORT: "1555"
  DATABASE_URL: postgres://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ include "teemii.fullname" . }}-db:5432/{{ .Values.database.name }}
