apiVersion: v1
kind: Service
metadata:
  name: {{ include "teemii.fullname" . }}-backend   # el frontend habla con este nombre
  labels:
    {{- include "teemii.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: teemii-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: express
      port: {{ .Values.backend.service.expressPort }}
      targetPort: 3000
    - name: socketio
      port: {{ .Values.backend.service.socketIoPort }}
      targetPort: 1555
