frontend:
  image: dokkaner/teemii-frontend
  tag: latest
  replicas: 1
  service:
    port: 80
    type: ClusterIP

backend:
  image: dokkaner/teemii-backend
  tag: latest
  replicas: 1
  url: http://teemii-backend:3000
  service:
    expressPort: 3000
    socketIoPort: 1555
    type: ClusterIP
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

database:
  image: postgres
  tag: "16-alpine"
  name: teemii
  user: teemii
  persistence:
    size: 1Gi
    storageClass: ""

ingress:
  enabled: true
  host: teemii.local
